<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Інтерактивний сайт за підручником «Пізнаємо природу. 5 клас»: 66 тем, вправи, тести, STEM-досліди, тренажери. Створено © Галина Гайдай">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Пізнаємо природу</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>/* Макет: світла «шкільна» тема за дизайном користувачки — біла основа, темно-синій заголовковий колір,
   жовтий акцент, кольори розділів (жовтий, бірюзовий, зелений, кораловий, синій). Одна свідома світла тема. */
:root{
  --bg:#ffffff; --bg-soft:#f4f8fd; --ink:#16245e; --text:#28335a; --muted:#5d6788; --line:#e3e9f4;
  --blue:#1252d9; --blue-d:#0b3fb0; --yellow:#ffd31a; --yellow-soft:#fff5c7;
  --s1:#ffcf1f; --s2:#2cc9c1; --s3:#7cc142; --s4:#f2655e; --s5:#2f7bf2;
  --s1-soft:#fff6d1; --s2-soft:#dcf7f5; --s3-soft:#e9f6dc; --s4-soft:#fde4e2; --s5-soft:#e0ecfe;
  --ok:#1f9d55; --ok-soft:#dcf5e6; --bad:#d93a3a; --bad-soft:#fde3e3; --green-card:#eef8ea;
  --shadow:0 6px 20px rgba(22,36,94,.10); --shadow-s:0 2px 8px rgba(22,36,94,.08);
  --f-display:"Montserrat","Nunito",system-ui,sans-serif; --f-body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);color:var(--ink);margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:8px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:1em;height:1em;flex:none}

/* ---------- Header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);box-shadow:0 2px 14px rgba(22,36,94,.07)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{height:54px;width:auto}
.brand b{font-family:var(--f-display);font-weight:800;color:var(--ink);font-size:1.45rem;line-height:.95;letter-spacing:-.01em}
.grade{background:var(--yellow);color:var(--ink);font-family:var(--f-display);font-weight:800;border-radius:999px;padding:6px 16px;font-size:1.05rem;white-space:nowrap}
.nav{margin-left:auto;display:flex;align-items:center}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 18px;color:var(--ink);text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:1.05rem;border-radius:12px}
.nav a+a{border-left:2px solid var(--line)}
.nav a svg{width:26px;height:26px;color:var(--blue)}
.nav a:hover,.nav a.on{background:var(--bg-soft)}
@media (max-width:820px){.nav a span{display:none}.nav a{padding:8px 10px}.brand b{font-size:1.15rem}.brand img{height:42px}.grade{font-size:.9rem;padding:4px 10px}.top .wrap{gap:10px}}
@media (max-width:430px){.grade{display:none}}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:-60px;top:120px;width:150px;height:240px;background:linear-gradient(160deg,#4fc3f7,#1fb5c9);border-radius:0 100% 0 100%;opacity:.85;transform:rotate(-12deg)}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:120px;background:linear-gradient(200deg,#5fd0f5,#2a9df4);border-radius:100% 0 100% 0;opacity:.8}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;align-items:center;padding-block:28px 18px}
.hero h1{font-size:clamp(2.2rem,5.2vw,4.1rem);font-weight:800;letter-spacing:-.02em}
.hero h1 .u{position:relative;white-space:nowrap}
.hero h1 .u::after{content:"";position:absolute;left:4%;right:2%;bottom:-.12em;height:.16em;background:var(--yellow);border-radius:50%;transform:rotate(-1.5deg)}
.hero p{font-size:1.2rem;color:var(--text);margin:22px 0 22px}
.btn{display:inline-flex;align-items:center;gap:12px;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:14px 30px;font-family:var(--f-display);font-weight:700;font-size:1.2rem;text-decoration:none;box-shadow:0 8px 20px rgba(18,82,217,.28);transition:transform .15s,background .15s}
.btn:hover{background:var(--blue-d);transform:translateY(-1px)}
.btn.sm{font-size:1rem;padding:10px 20px;box-shadow:none}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue);box-shadow:none}
.btn.ghost:hover{background:var(--bg-soft)}
.btn.yellow{background:var(--yellow);color:var(--ink);box-shadow:none}
.btn svg{width:18px;height:18px}
.hero-img{position:relative;border-radius:200px 28px 28px 200px;overflow:hidden;aspect-ratio:812/325;max-width:100%;box-shadow:var(--shadow)}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.hero-img::before{content:"";position:absolute;inset:0;border-radius:inherit;border-left:12px solid var(--yellow);z-index:1;pointer-events:none}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.hero-img{border-radius:120px 22px 22px 120px}.hero::before,.hero::after{display:none}}

/* ---------- Section titles ---------- */
.h-bar{display:flex;align-items:center;gap:14px;font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800;margin:18px 0 18px}
.h-bar::before{content:"";width:9px;height:1.15em;border-radius:5px;background:var(--yellow)}

/* ---------- Section cards ---------- */
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
@media (max-width:1100px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.cards{grid-template-columns:1fr}}
.scard{display:flex;flex-direction:column;background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .18s,box-shadow .18s}
.scard:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(22,36,94,.16)}
.scard .ph{aspect-ratio:300/170;overflow:hidden}
.scard .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.scard:hover .ph img{transform:scale(1.05)}
.scard .lb{display:flex;align-items:stretch;min-height:84px}
.scard .ic{width:84px;flex:none;display:grid;place-items:center;color:#fff;clip-path:polygon(0 0,100% 0,82% 100%,0 100%)}
.scard .ic svg{width:42px;height:42px}
.scard .nm{display:flex;flex-direction:column;justify-content:center;padding:8px 12px 8px 8px;min-width:0}
.scard .nm b{font-family:var(--f-display);font-weight:800;font-size:1.22rem;line-height:1.1}
.scard .nm small{color:var(--muted);font-size:.85rem;margin-top:4px}
.mini-bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.mini-bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.c1{--c:var(--s1);--cs:var(--s1-soft)}.c2{--c:var(--s2);--cs:var(--s2-soft)}.c3{--c:var(--s3);--cs:var(--s3-soft)}.c4{--c:var(--s4);--cs:var(--s4-soft)}.c5{--c:var(--s5);--cs:var(--s5-soft)}
.scard .ic{background:var(--c)} .c1 .ic{color:var(--ink)}

/* ---------- Bottom row on home ---------- */
.row2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;margin:28px 0 10px}
@media (max-width:860px){.row2{grid-template-columns:1fr}}
.week{display:flex;align-items:center;gap:18px;background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;min-height:110px;text-decoration:none;color:var(--ink)}
.week .wi{width:min(260px,34%);align-self:stretch;flex:none;background:center/cover;clip-path:polygon(0 0,100% 0,84% 100%,0 100%);position:relative}
.week .wi::after{content:"";position:absolute;right:6%;top:0;bottom:0;width:10px;background:var(--yellow);transform:skewX(-9deg)}
.week .wt{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:800;font-size:clamp(1.05rem,2vw,1.45rem);flex:1;min-width:0}
.week .wt svg{width:34px;height:34px;color:var(--blue);flex:none}
.week .btn{margin-right:20px}
@media (max-width:560px){.week{flex-wrap:wrap}.week .wi{width:100%;height:90px;clip-path:none}.week .wi::after{display:none}.week .wt{padding:0 16px;flex-basis:100%}.week .btn{margin:0 16px 16px}}
.prog-card{display:flex;align-items:center;gap:16px;background:var(--green-card);border-radius:20px;padding:22px 24px;text-decoration:none;color:var(--ink)}
.prog-card svg{width:34px;height:34px;color:var(--ok);flex:none}
.prog-card b{font-family:var(--f-display);font-size:1.4rem;white-space:nowrap}
.bar{flex:1;height:18px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 2px #e1ead9;min-width:60px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3fb24b,#6cc449);border-radius:999px;transition:width .6s}
.pct{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
footer{color:var(--muted);text-align:right;font-size:.95rem;padding-block:18px 26px}
footer b{color:var(--ink)}

/* ---------- Generic page ---------- */
main{min-height:60vh}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:.95rem;margin:18px 0 10px}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--blue)}
.band{border-radius:26px;background:var(--cs);padding:26px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:center;margin-bottom:22px;position:relative;overflow:hidden}
.band h1{font-size:clamp(1.6rem,3.6vw,2.6rem);font-weight:800}
.band p{margin:10px 0 0;color:var(--text);max-width:60ch}
.band .bimg{border-radius:20px;overflow:hidden;aspect-ratio:300/170;box-shadow:var(--shadow-s)}
.band .bimg img{width:100%;height:100%;object-fit:cover;display:block}
.band .chip{display:inline-flex;align-items:center;gap:8px;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:800;border-radius:999px;padding:5px 14px;font-size:.9rem;margin-bottom:12px}
.c1 .band .chip,.band.c1 .chip{color:var(--ink)}
@media (max-width:700px){.band{grid-template-columns:1fr;padding:20px}.band .bimg{display:none}}

/* topics list */
.tlist{display:grid;gap:10px;margin-bottom:30px}
.trow{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 16px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.trow:hover{border-color:var(--c);transform:translateX(3px)}
.trow .no{width:48px;height:48px;flex:none;border-radius:14px;background:var(--cs);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:var(--ink)}
.trow .tt{flex:1;min-width:0;font-weight:700;font-size:1.05rem;line-height:1.3}
.trow .tag{display:inline-block;font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-radius:6px;padding:2px 8px;margin-right:6px;vertical-align:2px}
.tag.lab{background:var(--s2-soft);color:#0d7a74}.tag.rev{background:var(--yellow-soft);color:#7a5b00}
.stars{display:flex;gap:2px;flex:none}
.stars svg{width:22px;height:22px;color:#d9dfeb}.stars svg.on{color:#ffbf00}

/* topic page */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px;padding:6px;background:var(--bg-soft);border-radius:18px}
.tabs button{flex:1 1 auto;border:0;background:transparent;border-radius:13px;padding:11px 16px;font-family:var(--f-display);font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;font-size:1rem}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-s)}
.tabs button .dot{width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.tabs button .dot svg{width:13px;height:13px}
.panel{display:grid;gap:20px;margin-bottom:24px}
.box{background:#fff;border:2px solid var(--line);border-radius:22px;padding:22px}
.box h3{font-size:1.25rem;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.box h3 .n{width:32px;height:32px;border-radius:10px;background:var(--cs);display:grid;place-items:center;font-size:.95rem}
.keys{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.keys li{display:flex;gap:14px;align-items:flex-start;max-width:78ch}
.keys li::before{content:"";flex:none;width:12px;height:12px;border-radius:4px;margin-top:.5em;background:var(--c);transform:rotate(45deg)}
.fact{background:var(--yellow-soft);border:0}
.fact h3{color:#6b4e00}
.fact p{margin:0 0 8px}
.fact p:last-child{margin:0}
.hint{color:var(--muted);font-size:.95rem;margin:-6px 0 14px}

/* flashcards */
.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.fc{perspective:900px;height:170px;border:0;background:none;padding:0}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .fa,.fc .ba{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:grid;place-items:center;padding:16px;text-align:center}
.fc .fa{background:var(--cs);font-family:var(--f-display);font-weight:800;color:var(--ink);font-size:1.2rem;border:2px solid transparent}
.fc .fa small{display:block;font-family:var(--f-body);font-weight:600;font-size:.78rem;color:var(--muted);margin-top:8px}
.fc .ba{background:#fff;border:2px solid var(--c);transform:rotateY(180deg);font-size:.98rem;color:var(--text)}
@media (prefers-reduced-motion:reduce){.fc .in{transition:none}}

/* exercises */
.tf{display:grid;gap:10px}
.tf .it{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--bg-soft)}
.tf .it p{flex:1 1 260px;margin:0;font-weight:600}
.tf .it .bt{display:flex;gap:8px}
.chipbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:700;color:var(--ink)}
.chipbtn:hover{border-color:var(--blue)}
.it.ok{background:var(--ok-soft)}.it.bad{background:var(--bad-soft)}
.res{font-weight:800;min-width:24px}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px 14px}
.match .col{display:grid;gap:10px;align-content:start}
.mcard{border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 13px;text-align:left;color:var(--text);font-size:.97rem;line-height:1.35;transition:all .15s}
.mcard.t{font-family:var(--f-display);font-weight:800;color:var(--ink)}
.mcard:hover{border-color:var(--blue)}
.mcard.sel{border-color:var(--blue);background:var(--s5-soft)}
.mcard.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.mcard.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (max-width:560px){.match{grid-template-columns:1fr 1.3fr;gap:8px}.mcard{font-size:.86rem;padding:9px}}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border-radius:14px;background:var(--bg-soft);margin-bottom:12px}
.pool .chipbtn.sel{border-color:var(--blue);background:var(--s5-soft)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bucket{border:2px dashed #c9d3e6;border-radius:16px;padding:12px;min-height:110px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.bucket:hover{border-color:var(--blue)}
.bucket b{font-family:var(--f-display);color:var(--ink);font-size:1rem}
.bucket .in{display:flex;flex-wrap:wrap;gap:6px}
.bucket .pl{background:var(--ok-soft);color:#145c33;border-radius:10px;padding:4px 10px;font-weight:700;font-size:.9rem}
.bucket.wrong{border-color:var(--bad);animation:shake .35s}
.order{display:grid;gap:8px;counter-reset:o}
.order .oi{display:flex;align-items:center;gap:10px;background:var(--bg-soft);border-radius:14px;padding:10px 12px;border:2px solid transparent}
.order .oi::before{counter-increment:o;content:counter(o);width:30px;height:30px;flex:none;border-radius:9px;background:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--ink)}
.order .oi span{flex:1;font-weight:600}
.order .oi.ok{border-color:var(--ok);background:var(--ok-soft)}.order .oi.bad{border-color:var(--bad);background:var(--bad-soft)}
.arr{border:0;background:#fff;border-radius:9px;width:36px;height:34px;display:grid;place-items:center;color:var(--blue)}
.arr svg{width:18px;height:18px}
.arr:disabled{opacity:.35;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.msg{font-weight:800}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}

/* quiz */
.quiz .qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:var(--muted);font-weight:700}
.quiz .qbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:18px}
.quiz .qbar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.quiz h4{font-size:1.3rem;font-weight:800;margin-bottom:16px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:600px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;text-align:left;font-weight:700;color:var(--ink);display:flex;gap:12px;align-items:center}
.opt .l{width:30px;height:30px;flex:none;border-radius:9px;background:var(--bg-soft);display:grid;place-items:center;font-family:var(--f-display)}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.result{text-align:center;padding:10px}
.result .big{font-family:var(--f-display);font-size:3.2rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.result .stars{justify-content:center;margin:8px 0 14px}
.result .stars svg{width:44px;height:44px}
.result .actions{justify-content:center}
.pager{display:flex;justify-content:space-between;gap:12px;margin:10px 0 34px;flex-wrap:wrap}
.pager a{flex:1 1 260px;display:flex;flex-direction:column;gap:2px;border:2px solid var(--line);border-radius:18px;padding:14px 18px;text-decoration:none;color:var(--ink)}
.pager a:hover{border-color:var(--blue)}
.pager a small{color:var(--muted);font-weight:700}
.pager a b{font-family:var(--f-display)}
.pager a.nx{text-align:right}

/* labs */
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-bottom:30px}
.lcard{display:flex;flex-direction:column;gap:10px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px;text-decoration:none;color:var(--text);transition:transform .15s,border-color .15s}
.lcard:hover{transform:translateY(-3px);border-color:var(--c)}
.lcard .li{width:56px;height:56px;border-radius:16px;background:var(--cs);display:grid;place-items:center;color:var(--ink)}
.lcard .li svg{width:30px;height:30px}
.lcard b{font-family:var(--f-display);font-size:1.15rem;color:var(--ink)}
.lcard small{color:var(--muted);font-weight:700}

/* анімації ілюстрацій */
.ill .spin{animation:spin 12s linear infinite}
.ill .spin2{animation:vane 4s ease-in-out infinite alternate}
.ill .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ill .glow{animation:glow 2.4s ease-in-out infinite}
.ill .bob{animation:bob 3s ease-in-out infinite}
.ill .jig{animation:jig .25s steps(2) infinite}
.ill .jig2{animation:jig2 1.2s ease-in-out infinite alternate}
.ill .fly circle{animation:fly 3s ease-in-out infinite alternate;transform-box:fill-box}
.ill .fly circle:nth-child(2n){animation-duration:2.2s;animation-direction:alternate-reverse}
.ill .fly circle:nth-child(3n){animation-duration:2.6s}
.ill .swing{animation:swing 2s ease-in-out infinite alternate;transform-origin:85px 120px}
.ill .diff{animation:diff 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.ill .rise{animation:rise 2.4s ease-in-out infinite}
.ill .fade{animation:fade 4s ease-in-out infinite alternate}
.ill .tilt{animation:tilt 4s ease-in-out infinite alternate}
.ill .wave{animation:wave 2.6s ease-in-out infinite alternate}
.ill .rain{animation:rain 1s linear infinite}
.ill .drip{animation:drip 1.8s ease-in infinite}
.ill .fly2{animation:fly2 5s ease-in-out infinite alternate}
.ill .drift{animation:drift 4s ease-in-out infinite alternate}
.ill .breathe{animation:breathe 3.2s ease-in-out infinite}
.ill .beat{animation:beat 1s ease-in-out infinite}
.ill .zap{animation:zap 1.6s linear infinite}
.ill .twinkle{animation:glow 1.6s ease-in-out infinite}
.ill .flash{animation:flash 2.5s steps(1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes vane{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes glow{50%{opacity:.55}}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes jig{to{transform:translate(.8px,.6px)}}
@keyframes jig2{to{transform:translate(3px,-2px)}}
@keyframes fly{to{transform:translate(14px,-12px)}}
@keyframes swing{to{transform:rotate(6deg)}}
@keyframes diff{to{transform:scale(1.9)}}
@keyframes rise{0%{transform:translateY(6px);opacity:0}40%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
@keyframes fade{to{opacity:.15}}
@keyframes tilt{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes wave{to{transform:translateX(10px)}}
@keyframes rain{from{transform:translateY(-6px);opacity:.3}to{transform:translateY(10px);opacity:1}}
@keyframes drip{0%{transform:translateY(-12px);opacity:0}30%{opacity:1}100%{transform:translateY(18px);opacity:0}}
@keyframes fly2{to{transform:translate(-30px,14px)}}
@keyframes drift{to{transform:translate(16px,-10px)}}
@keyframes breathe{50%{transform:scale(1.08)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(.98)}}
@keyframes zap{0%{transform:translate(-50px,-20px);opacity:0}20%{opacity:1}100%{transform:translate(0,0);opacity:0}}
@keyframes flash{0%,70%{opacity:1}75%{opacity:.1}80%{opacity:1}85%{opacity:.1}}

.clink{min-width:96px;min-height:96px;border-radius:18px;border:2px dashed #c9d3e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;color:var(--ink);background:#fff;padding:6px;font-size:.9rem}
.clink .pic{box-shadow:none;background:var(--ok-soft)}
.carr{font-size:1.6rem;color:var(--blue);font-weight:800}
.food{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 16px}
.food b{font-family:var(--f-display);font-size:1.5rem;color:var(--ink)}
.plate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:560px;margin:0 auto}
.psec{border:0;border-radius:20px;min-height:76px;font-family:var(--f-display);font-weight:800;color:var(--ink);font-size:1.05rem}
.ps0{background:#e9f6dc}.ps1{background:#fff3c4}.ps2{background:#fde4e2}.ps3{background:#e0ecfe}.ps4{grid-column:1/-1;background:#eef0f4}
.psec:hover{outline:3px solid var(--blue)}
.trainband{display:flex;align-items:center;gap:16px;background:var(--cs);border-radius:22px;padding:16px 20px;text-decoration:none;color:var(--ink);margin:-10px 0 24px;flex-wrap:wrap}
.trainband .tbi{width:52px;height:52px;border-radius:16px;background:#fff;display:grid;place-items:center;color:var(--blue)}
.trainband .tbi svg{width:28px;height:28px}
.trainband>span:nth-child(2){flex:1;min-width:200px;display:flex;flex-direction:column}
.trainband b{font-family:var(--f-display);font-size:1.2rem}
.trainband small{color:var(--muted);font-weight:700}
.trow5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.trow5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.trow5{grid-template-columns:1fr}}
.tchip{display:flex;align-items:center;gap:12px;background:var(--cs);border-radius:18px;padding:12px 14px;text-decoration:none;color:var(--ink);transition:transform .15s}
.tchip:hover{transform:translateY(-2px)}
.tchip .ic{width:44px;height:44px;flex:none;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center}
.tchip.c1 .ic{color:var(--ink)}
.tchip .ic svg{width:24px;height:24px}
.tchip b{font-family:var(--f-display);display:block;line-height:1.15}
.tchip small{color:var(--muted);font-weight:700}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.recs .rec{display:flex;flex-direction:column;align-items:stretch;gap:4px;background:var(--cs);border-radius:16px;padding:12px 14px;text-decoration:none;margin:0}
.recs .rec b{font-family:var(--f-display);margin-bottom:4px}
.recs .rec span{display:flex;justify-content:space-between;font-size:.88rem;font-weight:700;color:var(--text)}
.recs .rec i{font-style:normal;font-family:var(--f-display);color:var(--ink)}
@media (max-width:460px){.nav a{padding:6px 7px}.nav a+a{border-left-width:1px}.nav a svg{width:22px;height:22px}.brand b{font-size:1rem}.brand img{height:36px}.top .wrap{gap:6px}}
.row2>*{min-width:0}
@media (max-width:460px){.prog-card{flex-wrap:wrap;padding:16px}.prog-card .bar{flex-basis:100%;order:3}.week .btn{white-space:nowrap}}
</style>

/* ---------- SECTION ---------- */
function section(id){
  const s = sec(id); if(!s) return home();
  setNav('sections');
  app.innerHTML = `<div class="wrap c${s.id}">
    <div class="crumbs"><a href="#home">Головна</a> › <span>Розділ ${s.id}</span></div>
    <div class="band c${s.id}">
      <div><span class="chip">${I(s.icon)} Розділ ${s.id}</span><h1>${s.full}</h1><p>${s.d}</p>
      <div class="actions"><div class="bar" style="max-width:320px"><i style="width:${Math.max(secScore(s.id),2)}%"></i></div><span class="pct">${secScore(s.id)}%</span></div></div>
      <div class="bimg"><img src="${s.img}" alt=""></div>
    </div>
    <div class="tlist">${topicsOf(s.id).map(t=>`
      <a class="trow" href="#topic-${t.n}"><span class="no">${t.n}</span><span class="thumb">${PH(t.n)}</span>
        <span class="tt">${t.type==='lab'?'<span class="tag lab">Практична</span>':t.type==='review'?'<span class="tag rev">Узагальнення</span>':''}${esc(t.t)}</span>
        ${starRow(starsFor(topicScore(t)))}</a>`).join('')}
    </div>
    <a class="trainband c${s.id}" href="#train-${s.id}"><span class="tbi">${I('target')}</span><span><b>Тренажери розділу</b><small>Бліц, мемо-пари, знайди зайве, збери слово і гра «${SPECIAL[s.id].n}»</small></span><span class="btn sm">Грати ${I('chev')}</span></a>
    ${secPager(id)}
  </div>`;
}
function secPager(id){
  const p = sec(id-1), n = sec(id+1);
  return `<div class="pager">${p?`<a href="#section-${p.id}"><small>‹ Попередній розділ</small><b>${p.full}</b></a>`:'<span></span>'}${n?`<a class="nx" href="#section-${n.id}"><small>Наступний розділ ›</small><b>${n.full}</b></a>`:''}</div>`;
}

/* ---------- TOPIC ---------- */
let CUR = null, CUR_TAB = 'learn';
function topic(n){
  const t = byN[n]; if(!t) return home();
  setNav('sections');
  CUR = t;
  const s = sec(t.s);
  if (t.type==='review') return review(t);
  const tabs = topicTabs(t);
  if (!tabs.find(x=>x[0]===CUR_TAB)) CUR_TAB = tabs[0][0];
  app.innerHTML = `<div class="wrap c${s.id}">
    <div class="crumbs"><a href="#home">Головна</a> › <a href="#section-${s.id}">Розділ ${s.id}. ${s.t}</a> › <span>Тема ${t.n}</span></div>
    <div class="band c${s.id}">
      <div><span class="chip">${t.type==='lab'?I('flask')+' Практична робота':I(s.icon)+' Тема '+t.n}</span><h1>${esc(t.t)}</h1>
      <div class="actions">${starRow(starsFor(topicScore(t)))}<span class="pct" id="tscore">${topicScore(t)}%</span></div></div>
      <div class="bimg ill-card">${PH(t.n, t.t)}</div>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="panel" class="panel"></div>
    ${topicPager(t)}
  </div>`;
  renderTabs(); renderPanel();
}
function topicTabs(t){
  const a = [];
  if (t.type==='lab') a.push(['lab','Лабораторія','flask']);
  a.push(['learn', t.type==='lab'?'Хід роботи':'Головне','book']);
  if (t.g) a.push(['cards','Словничок','cards']);
  if (window.STEM[t.n]) a.push(['stem','STEM-дослід','bulb']);

/* ---------- exercises ---------- */
function tfTask(el, items, done){
  let left = items.length, errs = 0;
  el.innerHTML = `<div class="tf">${items.map((x,i)=>`<div class="it" data-i="${i}"><span class="pic">${PIC(x[0])||'🤔'}</span><p>${esc(x[0])}</p><div class="bt"><button class="chipbtn" data-v="1">Правда</button><button class="chipbtn" data-v="0">Неправда</button></div><span class="res"></span></div>`).join('')}</div><div class="actions"><span class="msg"></span></div>`;
  el.querySelectorAll('.it').forEach(it=>{
    it.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const x = items[+it.dataset.i], ok = (+b.dataset.v)===x[1];
      it.classList.remove('ok','bad'); it.classList.add(ok?'ok':'bad');
      const r = it.querySelector('.res'); r.className='res '+(ok?'ok':'bad'); r.textContent = ok?'✓':'✗';
      if(ok){ it.querySelectorAll('button').forEach(z=>z.disabled=true); left--; if(!left){ const m=el.querySelector('.msg'); m.className='msg ok'; m.textContent = errs? `Готово! Помилок: ${errs}.` : 'Чудово! Усе правильно.'; done(); } }
      else errs++;
    });
  });
}
function matchTask(el, pairs, done){
  const L = shuffle(pairs.map((p,i)=>({i,s:p[0]}))), R = shuffle(pairs.map((p,i)=>({i,s:p[1]})));
  el.innerHTML = `<div class="match"><div class="col">${L.map(x=>`<button class="mcard t" data-i="${x.i}">${PIC(x.s)?`<span class="pic sm">${PIC(x.s)}</span>`:''}${esc(x.s)}</button>`).join('')}</div><div class="col">${R.map(x=>`<button class="mcard d" data-i="${x.i}">${esc(x.s)}</button>`).join('')}</div></div><div class="actions"><span class="msg"></span></div>`;
  let sel=null, left=pairs.length;
  el.querySelectorAll('.mcard.t').forEach(b=>b.onclick=()=>{ if(b.classList.contains('done'))return; el.querySelectorAll('.mcard.t').forEach(z=>z.classList.remove('sel')); b.classList.add('sel'); sel=b; });
  el.querySelectorAll('.mcard.d').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('done')) return;
    if(!sel){ toast('Спочатку обери термін зліва'); return; }
    if(sel.dataset.i===b.dataset.i){ sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done'); sel=null; left--;
      if(!left){ const m=el.querySelector('.msg'); m.className='msg ok'; m.textContent='Усі пари знайдено!'; done(); } }
    else { b.classList.add('wrong'); sel.classList.add('wrong'); const s=sel; setTimeout(()=>{b.classList.remove('wrong'); s.classList.remove('wrong');},400); }
  });
}
function sortTask(el, so, done){
  const [cats, items] = so; let sel=null, left=items.length, errs=0;
  el.innerHTML = `<div class="pool">${shuffle(items.map((x,i)=>i)).map(i=>`<button class="chipbtn pcard" data-i="${i}"><span class="pic">${PIC(items[i][0])||'🔹'}</span><span>${esc(items[i][0])}</span></button>`).join('')}</div>
   <div class="buckets">${cats.map((c,ci)=>`<button class="bucket" data-c="${ci}"><b><span class="basket">🧺</span>${esc(c)}</b><span class="in"></span></button>`).join('')}</div><div class="actions"><span class="msg"></span></div>`;
  el.querySelectorAll('.pool .chipbtn').forEach(b=>b.onclick=()=>{ el.querySelectorAll('.pool .chipbtn').forEach(z=>z.classList.remove('sel')); b.classList.add('sel'); sel=b; });
  el.querySelectorAll('.bucket').forEach(bk=>bk.onclick=()=>{
    if(!sel){ toast('Спочатку обери картку'); return; }
    const it = items[+sel.dataset.i];
    if(it[1]===+bk.dataset.c){ const s=document.createElement('span'); s.className='pl'; s.textContent=(PIC(it[0])?PIC(it[0])+' ':'')+it[0]; bk.querySelector('.in').append(s); sel.remove(); sel=null; left--;
      if(!left){ const m=el.querySelector('.msg'); m.className='msg ok'; m.textContent= errs?`Готово! Помилок: ${errs}.`:'Бездоганно! Жодної помилки.'; el.querySelector('.pool').hidden=true; done(); } }
    else { errs++; bk.classList.add('wrong'); setTimeout(()=>bk.classList.remove('wrong'),400); }
  });
}
function orderTask(el, correct, done){
  let cur = shuffle(correct); if (cur.join()===correct.join()) cur = cur.slice().reverse();
  const draw = (mark)=>{
    el.innerHTML = `<div class="order">${cur.map((x,i)=>`<div class="oi ${mark?(x===correct[i]?'ok':'bad'):''}"><span class="pic sm">${PIC(x)||'▫️'}</span><span>${esc(x)}</span><button class="arr" data-u="${i}" ${i===0?'disabled':''} aria-label="Вгору">${I('up')}</button><button class="arr" data-d="${i}" ${i===cur.length-1?'disabled':''} aria-label="Вниз">${I('down')}</button></div>`).join('')}</div>
    <div class="actions"><button class="btn sm" id="chk">Перевірити</button><span class="msg"></span></div>`;
    el.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const i=+b.dataset.u;[cur[i-1],cur[i]]=[cur[i],cur[i-1]];draw();});
    el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const i=+b.dataset.d;[cur[i+1],cur[i]]=[cur[i],cur[i+1]];draw();});
    el.querySelector('#chk').onclick=()=>{ const ok=cur.every((x,i)=>x===correct[i]); draw(true); const m=el.querySelector('.msg'); m.className='msg '+(ok?'ok':'bad'); m.textContent= ok?'Правильно!':'Червоні рядки стоять не на своєму місці. Спробуй ще.'; if(ok) done(); };
  };
  draw();
}
function quiz(el, qs, onEnd, n){
  qs = qs.map(q=>({q:q.q, right:q.a[0], opts:shuffle(q.a)}));
  let i=0, score=0;
  const step = ()=>{
    if(i>=qs.length){
      const pct = Math.round(score/qs.length*100); onEnd(pct); const k=starsFor(pct);
      el.innerHTML = `<div class="result"><div class="big">${score} / ${qs.length}</div>${starRow(k)}<p>${pct>=90?'Блискуче! Ти справжній дослідник.':pct>=70?'Добре! Ще трохи — і буде ідеально.':pct>=40?'Непогано. Повтори головне і спробуй ще раз.':'Повтори тему і спробуй знову — у тебе вийде!'}</p>
       <div class="actions"><button class="btn sm" id="again">Пройти ще раз</button>${n&&byN[n+1]?`<a class="btn sm ghost" href="#topic-${n+1}">Наступна тема ${I('chev')}</a>`:''}</div></div>`;
      el.querySelector('#again').onclick=()=>quiz(el, qs.map(q=>({q:q.q,a:[q.right,...q.opts.filter(o=>o!==q.right)]})), onEnd, n);
      return;
    }
    const q=qs[i];
    el.innerHTML = `<div class="quiz"><div class="qtop"><span>Питання ${i+1} з ${qs.length}</span><span>Правильно: ${score}</span></div><div class="qbar"><i style="width:${i/qs.length*100}%"></i></div>
      <div class="qrow"><h4>${esc(q.q)}</h4>${n?`<div class="qill">${PH(n)}</div>`:''}</div><div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-o="${esc(o)}"><span class="l">${'АБВГД'[j]}</span>${PIC(o)?`<span class="pic sm">${PIC(o)}</span>`:''}<span>${esc(o)}</span></button>`).join('')}</div><div class="actions"><span class="msg"></span></div></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok = b.dataset.o===q.right; if(ok) score++;
      el.querySelectorAll('.opt').forEach(z=>{ z.disabled=true; if(z.dataset.o===q.right) z.classList.add('ok'); });
      if(!ok) b.classList.add('bad');
      const m=el.querySelector('.msg'); m.className='msg '+(ok?'ok':'bad'); m.textContent= ok?'Правильно!':'Правильна відповідь виділена зеленим.';
      const nb=document.createElement('button'); nb.className='btn sm'; nb.innerHTML=(i<qs.length-1?'Далі ':'Результат ')+I('chev'); nb.onclick=()=>{i++;step();};
      el.querySelector('.actions').prepend(nb); nb.focus();
    });
  };
  step();
}

    <h2 class="h-bar">Віртуальна лабораторія</h2>
    <div class="labs">${list.map(([id])=>{const L=LABS[id];const tp=byN[L.topic];return `<a class="lcard c${tp.s}" href="#lab-${id}"><span class="lill">${PH(L.topic)}</span><b>${L.name}</b><span>${L.hint}</span><small>Тема ${tp.n} · ${esc(tp.t)}</small></a>`}).join('')}</div>
    <h2 class="h-bar">STEM-досліди до кожної теми</h2>
    <p class="hint" style="margin-top:-6px">Прості досліди вдома і в класі: що знадобиться, кроки, наукове пояснення та інженерний виклик.</p>
    <div class="filters" id="flt"><button class="chipbtn on" data-s="0">Усі</button>${S.map(s=>`<button class="chipbtn" data-s="${s.id}">${s.t}</button>`).join('')}</div>
    <div id="sg"></div>
    <h2 class="h-bar">Практичні роботи підручника</h2>
    <div class="tlist">${T.filter(t=>t.type==='lab').map(t=>`<a class="trow c${t.s}" href="#topic-${t.n}"><span class="no">${t.n}</span><span class="tt">${esc(t.t)}</span>${starRow(starsFor(topicScore(t)))}</a>`).join('')}</div>
    <div class="box"><h3>${I('bulb')} Правила безпеки під час практичних робіт</h3><ul class="keys" style="--c:var(--s4)">
      <li>Уважно вислухай інструкцію вчителя і виконуй лише ті дії, що описані в роботі.</li>
      <li>Не куштуй речовини і не нюхай їх, нахиляючись над посудиною: спрямовуй запах до себе рукою.</li>
      <li>Обережно поводься з гарячою водою, склом і гострими предметами.</li>
      <li>Не спрямовуй сонячне світло на дзеркало мікроскопа і не дивися крізь лупу на сонце.</li>
      <li>Після роботи прибери робоче місце і вимий руки.</li></ul></div>

  const draw = s => { $('#sg').innerHTML = stemGrid(T.filter(t=>window.STEM[t.n] && (!s || t.s===s))); };

function labPage(id){
  const L = LABS[id]; if(!L) return labsPage();
  setNav('labs'); const tp = byN[L.topic];
  app.innerHTML = `<div class="wrap c${tp.s}"><div class="crumbs"><a href="#home">Головна</a> › <a href="#labs">Досліди</a> › <span>${L.name}</span></div><div class="panel" id="panel"></div>
   <div class="actions" style="margin-bottom:30px"><a class="btn sm ghost" href="#topic-${tp.n}">${I('book')} До теми ${tp.n}: ${esc(tp.t)}</a></div></div>`;
  $('#panel').append(boxEl('', L.name, L.hint, el=>L.run(el, ()=>{ markEx(L.topic,'lab'); })));
}
const rng = (id, label, min, max, step, val, unit) => `<label for="${id}"><span>${label}<output id="${id}-o">${val} ${unit}</output></span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`;
const bindR = (el, ids, units, cb) => { ids.forEach((id,k)=>{ const r=el.querySelector('#'+id); r.oninput=()=>{ el.querySelector('#'+id+'-o').textContent=r.value+' '+units[k]; cb(); }; }); };

LABS.diffusion = {name:'Дифузія і випаровування', icon:'beaker', topic:13, hint:'Капни барвник у холодну й гарячу воду та порівняй. Потім дослідь, від чого залежить швидкість випаровування.',
run(el, done){
  el.innerHTML = `<div class="lab"><div><div class="stage"><canvas id="cv" width="520" height="300" aria-label="Дві склянки з водою"></canvas></div>
    <div class="actions"><button class="btn sm" id="drop">Капнути барвник</button><span class="msg" id="dm"></span></div></div>
    <div class="ctrl"><b style="font-family:var(--f-display);color:var(--ink)">Випаровування</b>
      <label for="liq"><span>Рідина</span><select id="liq"><option value="1">Вода</option><option value="3">Спирт</option><option value="2.4">Парфуми</option><option value="0.2">Олія</option></select></label>
      ${rng('et','Температура',10,60,5,20,'°С')}${rng('ea','Площа вільної поверхні',1,5,1,1,'×')}
      <div class="actions"><button class="btn sm" id="ev">Запустити</button></div>
      <div class="stage"><svg viewBox="0 0 300 120" id="es"></svg></div><div class="msg" id="em"></div></div></div>`;
  const cv=el.querySelector('#cv'), cx=cv.getContext('2d'); let parts=[], raf, t0=0, tries=new Set();
  const glass=(x,lab,col)=>{ cx.fillStyle=col; cx.fillRect(x,60,200,210); cx.strokeStyle='#16245e'; cx.lineWidth=4; cx.strokeRect(x,60,200,210); cx.fillStyle='#16245e'; cx.font='700 16px Nunito, sans-serif'; cx.fillText(lab,x+40,40); };
  const frame=()=>{
    cx.clearRect(0,0,520,300); glass(40,'Холодна вода','#e4f1ff'); glass(280,'Гаряча вода','#ffece6');
    parts.forEach(p=>{ const sp=p.h?2.6:0.7; p.x+= (Math.random()-.5)*sp*2; p.y+=(Math.random()-.5)*sp*2 + (p.y<90?0.6:0);
      const x0=p.h?282:42; p.x=Math.max(x0+2,Math.min(x0+196,p.x)); p.y=Math.max(62,Math.min(266,p.y));
      cx.fillStyle='rgba(124,58,237,.55)'; cx.beginPath(); cx.arc(p.x,p.y,3,0,7); cx.fill(); });
    if(parts.length && performance.now()-t0>5000 && !el.dataset.dd){ el.dataset.dd=1; const m=el.querySelector('#dm'); m.className='msg ok'; m.textContent='У гарячій воді барвник розійшовся швидше: частинки рухаються швидше!'; tries.add('d'); chk(); }
    raf=requestAnimationFrame(frame);
  };
  el.querySelector('#drop').onclick=()=>{ parts=[]; for(let i=0;i<220;i++){ parts.push({x:140+Math.random()*8,y:70+Math.random()*8,h:0}); parts.push({x:380+Math.random()*8,y:70+Math.random()*8,h:1}); } t0=performance.now(); delete el.dataset.dd; };
  frame();
  const obs=new MutationObserver(()=>{ if(!document.body.contains(cv)){ cancelAnimationFrame(raf); obs.disconnect(); } }); obs.observe(app,{childList:true});
  bindR(el,['et','ea'],['°С','×'],()=>{});
  let evr;
  el.querySelector('#ev').onclick=()=>{
    cancelAnimationFrame(evr);
    const k=+el.querySelector('#liq').value*(1+(+el.querySelector('#et').value-10)/25)*(+el.querySelector('#ea').value);

      if(f<1) evr=requestAnimationFrame(step); else { const m=el.querySelector('#em'); m.className='msg ok'; m.textContent=`Час випаровування: умовно ${secs} с. Що вища температура, більша площа поверхні і «летючіша» рідина — то швидше.`; tries.add('e'); chk(); } };
    step();
  };
  const chk=()=>{ if(tries.has('d')&&tries.has('e')) done(); };
}};

function gMemo(el, s){
  const pairs = shuffle(secPool(s).flatMap(t=>t.g||[])).slice(0,6);
  const cards = shuffle(pairs.flatMap((p,i)=>[{i,t:p[0],k:'t'},{i,t:p[1],k:'d'}]));
  let open=[], found=0, moves=0, lock=false;
  el.innerHTML = `<div class="gtop"><span>Ходи: <b id="mv">0</b></span><span>Знайдено: <b id="mf">0</b> / 6</span></div><div class="memo">${cards.map((c,j)=>`<button class="mc ${c.k}" data-j="${j}"><span class="back">${I('leaf')}</span><span class="face">${c.k==='t'&&PIC(c.t)?`<span class="pic sm">${PIC(c.t)}</span>`:''}${esc(c.t)}</span></button>`).join('')}</div>`;
  el.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains('open')) return; b.classList.add('open'); open.push(b);
    if(open.length===2){ moves++; $('#mv',el).textContent=moves; const [a,c]=open.map(x=>cards[+x.dataset.j]);
      if(a.i===c.i && a.k!==c.k){ open.forEach(x=>x.classList.add('got')); open=[]; found++; $('#mf',el).textContent=found;
        if(found===6){ const score=Math.max(10,100-(moves-6)*6); setTimeout(()=>finish(el,s,'memo',score,100,()=>gMemo(el,s)),600);} }
      else { lock=true; setTimeout(()=>{ open.forEach(x=>x.classList.remove('open')); open=[]; lock=false; },900); } }
  });
}

function gOdd(el, s){

  const rounds = shuffle(groups).slice(0,8); let r=0, sc=0;
  const step=()=>{ if(r>=rounds.length) return finish(el,s,'odd',sc,rounds.length,()=>gOdd(el,s));
    const g=rounds[r], three=shuffle(g.its).slice(0,3), odd=shuffle(g.others)[0], opts=shuffle([...three.map(x=>[x,0]),[odd[0],1]]);
    el.innerHTML=`<div class="gtop"><span>Раунд ${r+1} з ${rounds.length}</span><span>Бали: <b>${sc}</b></span></div><h4 class="gq">Що тут зайве?</h4><div class="oddgrid">${opts.map(([x,o])=>`<button class="oddc" data-o="${o}"><span class="pic">${PIC(x)||'🔹'}</span>${esc(x)}</button>`).join('')}</div><div class="actions"><span class="msg" id="om"></span></div>`;

      const m=$('#om',el); m.className='msg '+(ok?'ok':'bad'); m.textContent=(ok?'Правильно! ':'Ні. ')+`Решта — «${g.c}» (тема ${g.t.n}).`;
      const nb=document.createElement('button'); nb.className='btn sm'; nb.innerHTML='Далі '+I('chev'); nb.onclick=()=>{r++;step();}; el.querySelector('.actions').prepend(nb); });
  }; step();
}

function gWord(el, s){

  let r=0, sc=0;
  const step=()=>{ if(r>=pool.length) return finish(el,s,'word',sc,pool.length,()=>gWord(el,s));
    const [w,d]=pool[r], W=w.toUpperCase(), letters=shuffle([...W].map((ch,i)=>({ch,i}))); let built=[]; let hinted=false;
    const draw=()=>{ el.innerHTML=`<div class="gtop"><span>Слово ${r+1} з ${pool.length}</span><span>Бали: <b>${sc}</b></span></div>
      <div class="wdef"><span class="pic big">${PIC(w)||'💡'}</span><p>${esc(d)}</p></div>
      <div class="slots">${[...W].map((_,k)=>`<span class="slot">${built[k]?built[k].ch:''}</span>`).join('')}</div>
      <div class="tiles">${letters.map((l,k)=>`<button class="tile" data-k="${k}" ${built.includes(l)?'disabled':''}>${l.ch}</button>`).join('')}</div>
      <div class="actions"><button class="btn sm ghost" id="wb">⌫ Стерти</button><button class="btn sm ghost" id="wh">Підказка</button><span class="msg" id="wm"></span></div>`;
      el.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ built.push(letters[+b.dataset.k]); if(built.length===W.length){ const got=built.map(x=>x.ch).join(''); const ok=got===W; draw(); const m=$('#wm',el);
          if(ok){ if(!hinted) sc++; m.className='msg ok'; m.textContent='Чудово! «'+w+'»'; setTimeout(()=>{r++;step();},1100);} else { m.className='msg bad'; m.textContent='Не те слово. Стирай і пробуй ще!'; } } else draw(); });
      $('#wb',el).onclick=()=>{ built.pop(); draw(); };
      $('#wh',el).onclick=()=>{ hinted=true; const m=$('#wm',el); m.className='msg'; m.textContent='Починається на «'+W[0]+'», літер: '+W.length+'.'; };
    }; draw();
  }; step();
}

/* Стани речовини */
function gStates(el,s){
  const MIS=[['Перетвори воду на лід',t=>t<=0],['Зроби рідку воду кімнатної температури',t=>t>=15&&t<=30],['Доведи воду до кипіння — отримай пару',t=>t>=100]];
  let mi=0;
  el.innerHTML=`<div class="lab"><div class="stage"><canvas id="pc" width="420" height="300" aria-label="Частинки води"></canvas></div><div class="ctrl">
    <div class="note" id="mis"></div>
    <label for="tp"><span>Температура<output id="tp-o">20 °С</output></span><input type="range" id="tp" min="-30" max="130" value="20"></label>
    <div class="stateb" id="stb"></div>
    <div class="actions"><button class="btn sm" id="mchk">Перевірити завдання</button><span class="msg" id="mm3"></span></div>
    <p class="hint">Лід — частинки лише коливаються на місці. Вода — рухаються, але тримаються близько. Пара — літають швидко й далеко.</p></div></div>`;
  const cv=$('#pc',el), cx=cv.getContext('2d'); const N=42; const P=[...Array(N)].map((_,k)=>({hx:60+(k%7)*48,hy:70+Math.floor(k/7)*34,x:0,y:0,vx:0,vy:0}));
  P.forEach(p=>{p.x=p.hx;p.y=p.hy;});
  const T=()=>+$('#tp',el).value; const state=t=>t<=0?'Лід (тверда речовина)':t<100?'Вода (рідина)':'Пара (газ)';
  const upd=()=>{ $('#tp-o',el).textContent=T()+' °С'; $('#stb',el).textContent=state(T()); $('#mis',el).textContent=mi<MIS.length?`Завдання ${mi+1} з 3: ${MIS[mi][0]}.`:'Усі завдання виконано!'; };
  $('#tp',el).oninput=upd; upd(); let raf;
  const fr=()=>{ if(!document.body.contains(cv)){cancelAnimationFrame(raf);return;} const t=T(); cx.clearRect(0,0,420,300);
    cx.fillStyle=t<=0?'#e6f6ff':t<100?'#d6ebff':'#f2f6fb'; cx.fillRect(0,0,420,300);
    P.forEach(p=>{ if(t<=0){ p.x=p.hx+(Math.random()-.5)*(2+(t+30)/10); p.y=p.hy+(Math.random()-.5)*(2+(t+30)/10); }
      else if(t<100){ const sp=.6+t/60; p.vx+=(Math.random()-.5)*sp; p.vy+=(Math.random()-.5)*sp+.08; p.vx*=.9; p.vy*=.9; p.x+=p.vx; p.y+=p.vy; p.x=Math.max(12,Math.min(408,p.x)); p.y=Math.max(110,Math.min(288,p.y)); }
      else { const sp=2.5+(t-100)/10; if(Math.abs(p.vx)<.5){p.vx=(Math.random()-.5)*sp*2;p.vy=(Math.random()-.5)*sp*2;} p.x+=p.vx; p.y+=p.vy; if(p.x<10||p.x>410)p.vx*=-1; if(p.y<10||p.y>290)p.vy*=-1; }
      cx.fillStyle='#2f7bf2'; cx.strokeStyle='#16245e'; cx.lineWidth=2; cx.beginPath(); cx.arc(p.x,p.y,8,0,7); cx.fill(); cx.stroke(); });
    raf=requestAnimationFrame(fr); }; fr();
  $('#mchk',el).onclick=()=>{ const m=$('#mm3',el); if(mi>=MIS.length) return; if(MIS[mi][1](T())){ mi++; m.className='msg ok'; m.textContent='Виконано!'; upd(); if(mi===MIS.length) setBest(s,'states',3)&&($('#rec').textContent=3); } else { m.className='msg bad'; m.textContent='Ще ні — зміни температуру.'; } };
}
/* Компас */
const DIRS=[['Пн',0,-1],['ПнСх',1,-1],['Сх',1,0],['ПдСх',1,1],['Пд',0,1],['ПдЗх',-1,1],['Зх',-1,0],['ПнЗх',-1,-1]];
const DNAME={Пн:'північ',ПнСх:'північний схід',Сх:'схід',ПдСх:'південний схід',Пд:'південь',ПдЗх:'південний захід',Зх:'захід',ПнЗх:'північний захід'};
const PLACES=[['🌲','ліс'],['🏞️','озеро'],['⛪','церква'],['🏠','будинок'],['🌉','міст'],['🌾','поле'],['🍎','сад'],['🏥','лікарня']];
function gCompass(el,s){
  let r=0, sc=0;
  const step=()=>{ if(r>=10) return finish(el,s,'compass',sc,10,()=>gCompass(el,s));
    const pl=shuffle(PLACES); const ds=shuffle(DIRS).slice(0,4); const target=Math.random()*4|0;
    el.innerHTML=`<div class="gtop"><span>Питання ${r+1} з 10</span><span>Бали: <b>${sc}</b></span></div>
     <div class="lab"><div class="stage"><svg viewBox="0 0 300 300"><rect x="10" y="10" width="280" height="280" rx="18" fill="#f3f9ec" stroke="#7cc142" stroke-width="2"/>
      ${ds.map((d,k)=>`<text x="${150+d[1]*100}" y="${160+d[2]*100}" text-anchor="middle" font-size="34">${pl[k][0]}</text>`).join('')}
      <text x="150" y="162" text-anchor="middle" font-size="34">🏫</text><text x="150" y="190" text-anchor="middle" font-size="12" font-weight="800" fill="#16245e">школа</text>
      <g transform="translate(262 46)"><circle r="22" fill="#fff" stroke="#16245e" stroke-width="2"/><path d="M0-18l5 18H-5z" fill="#f2655e"/><path d="M0 18l5-18H-5z" fill="#c9d3e6"/><text y="-26" text-anchor="middle" font-size="11" font-weight="800" fill="#16245e">Пн</text></g></svg></div>
     <div class="ctrl"><h4 class="gq">У якому напрямку від школи ${pl[target][1]} ${pl[target][0]}?</h4><div class="dirs">${DIRS.map(d=>`<button class="chipbtn" data-d="${d[0]}">${DNAME[d[0]]}</button>`).join('')}</div><div class="actions"><span class="msg" id="cm"></span></div></div></div>`;
    el.querySelectorAll('.dirs button').forEach(b=>b.onclick=()=>{ const ok=b.dataset.d===ds[target][0]; if(ok) sc++; el.querySelectorAll('.dirs button').forEach(z=>{z.disabled=true; if(z.dataset.d===ds[target][0]) z.classList.add('ok');}); if(!ok) b.classList.add('bad');
      const m=$('#cm',el); m.className='msg '+(ok?'ok':'bad'); m.textContent= ok?'Правильно!':`Ні, це ${DNAME[ds[target][0]]}.`; const nb=document.createElement('button'); nb.className='btn sm'; nb.innerHTML='Далі '+I('chev'); nb.onclick=()=>{r++;step();}; el.querySelector('.ctrl .actions').prepend(nb); });
  }; step();
}
/* Ланцюг живлення */
const CHAINS=[['Трава','Коник','Жаба','Лелека'],['Зерно','Миша','Лисиця'],['Листя капусти','Гусениця','Синиця','Яструб'],['Водорості','Дафнія','Карась','Щука'],['Жолуді','Білка','Куниця'],['Нектар квітів','Бджола','Павук','Ластівка'],['Кора дерев','Заєць','Вовк']];
const CPIC={'Трава':'🌿','Коник':'🦗','Жаба':'🐸','Лелека':'🦩','Зерно':'🌾','Миша':'🐭','Лисиця':'🦊','Листя капусти':'🥬','Гусениця':'🐛','Синиця':'🐦','Яструб':'🦅','Водорості':'🌱','Дафнія':'🦐','Карась':'🐟','Щука':'🐟','Жолуді':'🌰','Білка':'🐿️','Куниця':'🦡','Нектар квітів':'🌸','Бджола':'🐝','Павук':'🕷️','Ластівка':'🐦','Кора дерев':'🪵','Заєць':'🐇','Вовк':'🐺'};
function gChain(el,s){
  const rounds=shuffle(CHAINS).slice(0,5); let r=0, sc=0;
  const step=()=>{ if(r>=rounds.length) return finish(el,s,'chain',sc,rounds.length,()=>gChain(el,s));
    const ch=rounds[r], pool=shuffle(ch); let built=[], first=true;
    const draw=(msg)=>{ el.innerHTML=`<div class="gtop"><span>Ланцюг ${r+1} з ${rounds.length}</span><span>Бали: <b>${sc}</b></span></div><h4 class="gq">Хто кого їсть? Натискай по черзі — від рослини до хижака.</h4>
      <div class="chain">${ch.map((_,k)=>`<span class="clink">${built[k]?`<span class="pic">${CPIC[built[k]]}</span>${esc(built[k])}`:'?'}</span>${k<ch.length-1?'<span class="carr">→</span>':''}`).join('')}</div>
      <div class="oddgrid">${pool.map(x=>`<button class="oddc" data-x="${esc(x)}" ${built.includes(x)?'disabled':''}><span class="pic">${CPIC[x]}</span>${esc(x)}</button>`).join('')}</div>
      <div class="actions"><button class="btn sm ghost" id="cr">Почати спочатку</button><span class="msg ${msg?msg[0]:''}">${msg?msg[1]:''}</span></div>`;
      el.querySelectorAll('.oddc').forEach(b=>b.onclick=()=>{ built.push(b.dataset.x); if(built.length===ch.length){ const ok=built.join()===ch.join(); if(ok){ if(first) sc++; draw(['ok','Правильний ланцюг живлення!']); setTimeout(()=>{r++;step();},1300);} else { first=false; draw(['bad','Порядок неправильний. Почни спочатку.']); } } else draw(); });
      $('#cr',el).onclick=()=>{ built=[]; draw(); };
    }; draw();
  }; step();
}
/* Тарілка здоров’я */
const PLATE=['Овочі й фрукти','Крупи та хліб','Білки','Молочне'];
const FOODS=[['Морква',0],['Яблуко',0],['Броколі',0],['Огірок',0],['Гречана каша',1],['Цільнозерновий хліб',1],['Вівсянка',1],['Риба',2],['Яйце',2],['Квасоля',2],['Курка',2],['Молоко',3],['Сир',3],['Кефір',3],['Чипси',4],['Газована вода',4],['Цукерки',4],['Фастфуд',4]];
const FPIC={'Морква':'🥕','Яблуко':'🍎','Броколі':'🥦','Огірок':'🥒','Гречана каша':'🥣','Цільнозерновий хліб':'🍞','Вівсянка':'🥣','Риба':'🐟','Яйце':'🥚','Квасоля':'🫘','Курка':'🍗','Молоко':'🥛','Сир':'🧀','Кефір':'🥛','Чипси':'🍟','Газована вода':'🥤','Цукерки':'🍬','Фастфуд':'🍔'};
function gPlate(el,s){
  const pool=shuffle(FOODS).slice(0,12); let i=0, sc=0;
  const draw=(msg)=>{ if(i>=pool.length) return finish(el,s,'plate',sc,pool.length,()=>gPlate(el,s));
    const f=pool[i];
    el.innerHTML=`<div class="gtop"><span>Продукт ${i+1} з ${pool.length}</span><span>Бали: <b>${sc}</b></span></div>
     <div class="food"><span class="pic big">${FPIC[f[0]]}</span><b>${esc(f[0])}</b></div>
     <div class="plate">${PLATE.map((p,k)=>`<button class="psec ps${k}" data-k="${k}">${p}</button>`).join('')}<button class="psec ps4" data-k="4">🧺 Обмежити</button></div>
     <div class="actions"><span class="msg ${msg?msg[0]:''}">${msg?msg[1]:''}</span></div>`;
    el.querySelectorAll('.psec').forEach(b=>b.onclick=()=>{ const ok=+b.dataset.k===f[1]; if(ok) sc++; i++; draw([ok?'ok':'bad', ok?'Так!':`«${f[0]}» — це ${f[1]===4?'те, що краще обмежити':'«'+PLATE[f[1]]+'»'}.`]); });
  }; draw();
}
const GAMEFN={blitz:gBlitz,memo:gMemo,odd:gOdd,word:gWord,science:gScience,states:gStates,compass:gCompass,chain:gChain,plate:gPlate};
function gamePage(s,g){
  if(!sec(s)||!GAMEFN[g]) return trainAll();
  const sp=SPECIAL[s]; const meta = GAMES[g] || (sp.id===g?sp:null); if(!meta) return trainHub(s);
  gameShell(s,g,meta.n,meta.d,el=>GAMEFN[g](el,s));
}

/* ---------- router ---------- */
function route(){
  const h = (location.hash||'').slice(1);
  let m;
  if ((m=h.match(/^topic-(\d+)$/))) { if(!CUR || CUR.n!==+m[1]) CUR_TAB = byN[+m[1]] && byN[+m[1]].type==='lab' ? 'lab' : 'learn'; topic(+m[1]); }
  else if ((m=h.match(/^stem-(\d+)$/))) { CUR_TAB='stem'; topic(+m[1]); }
  else if ((m=h.match(/^section-(\d)$/))) section(+m[1]);
  else if (h==='sections') section(1);
  else if (h==='labs') labsPage();
  else if (h==='train') trainAll();
  else if ((m=h.match(/^train-(\d)$/))) trainHub(+m[1]);
  else if ((m=h.match(/^game-(\d)-([a-z]+)$/))) gamePage(+m[1], m[2]);
  else if ((m=h.match(/^lab-([a-z]+)$/))) labPage(m[1]);
  else if (h==='progress') progress();
  else home();
  if(!/^(topic|stem)-/.test(h)) CUR=null;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
})();
</script>

</html>
